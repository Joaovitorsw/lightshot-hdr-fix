<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">Controlled HDR gray-patch comparison</title><desc id="desc">Controlled test, not a game screenshot. Original values 210,255,255,255. Corrected values 118,240,250,253.</desc><rect width="1280" height="440" rx="24" fill="#101827"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="55" fill="#f8fafc" font-size="28" font-weight="700">Highlight detail, measured in gray patches</text><text x="48" y="88" fill="#94a3b8" font-size="17">Controlled test data · 8-bit output values · not a game screenshot</text><text x="48" y="165" fill="#a78bfa" font-size="18">ORIGINAL / GDI</text><text x="48" y="295" fill="#5eead4" font-size="18">CORRECTED / FP16 → SDR</text>
<g fill="#cbd5e1" font-size="20" text-anchor="middle"><text x="491" y="232">210</text><text x="697" y="232">255</text><text x="903" y="232">255</text><text x="1109" y="232">255</text><text x="491" y="362">118</text><text x="697" y="362">240</text><text x="903" y="362">250</text><text x="1109" y="362">253</text></g><text x="48" y="412" fill="#94a3b8" font-size="16">Tone mapping changes the tone curve; this test does not claim universal color equivalence.</text></g>
