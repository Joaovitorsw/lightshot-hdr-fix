name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  patcher:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Test version guards and copy isolation
        run: python -m unittest discover -s tests -p test_package_copy.py -v
  color:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build CPU color reference
        run: g++ -std=c++20 -O2 src/color.cpp tests/color_tests.cpp -o color_tests
      - name: Test FP16, tone mapping and transfer accuracy
        run: ./color_tests
