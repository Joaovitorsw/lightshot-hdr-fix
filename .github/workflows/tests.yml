name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  patcher:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Test version guards and copy isolation
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test native Windows installer backend
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Rejection fixtures intentionally exit nonzero; inspect the suite
          # process exit rather than a stale fixture's LASTEXITCODE.
          powershell.exe -NoProfile -NonInteractive -File .\tests\test_installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -File .\tests\test_launcher.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  color:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build CPU color reference
        run: g++ -std=c++20 -O2 src/color.cpp tests/color_tests.cpp -o color_tests
      - name: Test FP16, tone mapping and transfer accuracy
        run: ./color_tests
